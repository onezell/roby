services:
  backend:
    build:
      context: ./attic-studio-backend
      dockerfile: Dockerfile
    container_name: attic-studio-backend
    restart: unless-stopped
    expose:
      - "1337"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=1337
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
      - APP_KEYS=${STRAPI_APP_KEYS:-ghiYUOY2aFRgMwNcv5Pxfr9xnWNj0rZfhmWHxrZETnU=,7Tbwpp1tEwhEHZe9NuXkVO97WfHMBeKTwoCFh1mtXXk=,JwQSRyO9HdxXssfjh+tpY/EBL4/dcn15bQSed2c1aDg=,JKqGRSW2+rv2sV2JEzmIUFwwfZ6Lkb/l9eBAEMFrt6Q=}
      - API_TOKEN_SALT=${STRAPI_API_TOKEN_SALT:-ghiYUOY2aFRgMwNcv5Pxfr9xnWNj0rZfhmWHxrZETnU=}
      - ADMIN_JWT_SECRET=${STRAPI_ADMIN_JWT_SECRET:-7Tbwpp1tEwhEHZe9NuXkVO97WfHMBeKTwoCFh1mtXXk=}
      - TRANSFER_TOKEN_SALT=${STRAPI_TRANSFER_TOKEN_SALT:-JwQSRyO9HdxXssfjh+tpY/EBL4/dcn15bQSed2c1aDg=}
      - JWT_SECRET=${STRAPI_JWT_SECRET:-JKqGRSW2+rv2sV2JEzmIUFwwfZ6Lkb/l9eBAEMFrt6Q=}
      - STRAPI_ADMIN_BACKEND_URL=${BACKEND_URL:-https://atticstudio.com/admin}
    volumes:
      - backend-data:/app/.tmp
      - backend-uploads:/app/public/uploads
    networks:
      - attic-network

  frontend:
    build:
      context: ./attic-studio-frontend
      dockerfile: Dockerfile
    container_name: attic-studio-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_STRAPI_URL=http://backend:1337
      - NEXT_PUBLIC_SITE_URL=${SITE_URL:-https://atticstudio.com}
    depends_on:
      - backend
    networks:
      - attic-network

volumes:
  backend-data:
  backend-uploads:

networks:
  attic-network:
    driver: bridge
