services:
  backend:
    build:
      context: ./attic-studio-backend
      dockerfile: Dockerfile
    container_name: attic-studio-backend
    restart: unless-stopped
    ports:
      - "1337:1337"
    environment:
      - NODE_ENV=production
      - DATABASE_CLIENT=sqlite
      - DATABASE_FILENAME=.tmp/data.db
    volumes:
      - backend-data:/app/.tmp
      - backend-uploads:/app/public/uploads
    networks:
      - attic-network

  frontend:
    build:
      context: ./attic-studio-frontend
      dockerfile: Dockerfile
    container_name: attic-studio-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_STRAPI_URL=http://backend:1337
      - NEXT_PUBLIC_SITE_URL=https://atticstudio.com
    depends_on:
      - backend
    networks:
      - attic-network

volumes:
  backend-data:
  backend-uploads:

networks:
  attic-network:
    driver: bridge
