  frontend:
    build:
      context: ./attic-studio-frontend
      dockerfile: Dockerfile
    container_name: attic-studio-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=https://atticstudio.com
    networks:
      - attic-network

volumes:
  backend-data:
  backend-uploads:

networks:
  attic-network:
    driver: bridge
